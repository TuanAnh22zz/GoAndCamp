    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thanh toán - GoAndCamp</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background: #f8f9fa; padding: 50px 0; }
            .checkout-container { 
                background: white; 
                padding: 30px; 
                border-radius: 10px; 
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
            #order-summary {
                max-height: 300px; 
                overflow-y: auto;
            }
        </style>
    </head>
    <body>

        <div class="container checkout-container">
            <h2 class="text-center mb-4">THÔNG TIN THANH TOÁN</h2>
            
            <div class="row">
                <div class="col-md-7">
                    <h4>Thông tin giao hàng</h4>
                    <form id="checkout-form">
                        <div class="mb-3">
                            <label>Họ và tên</label>
                            <input type="text" id="cus_name" class="form-control" required placeholder="Nhập tên của bạn">
                        </div>
                        <div class="mb-3">
                            <label>Số điện thoại</label>
                            <input type="text" id="cus_phone" class="form-control" required placeholder="Nhập số điện thoại">
                        </div>
                        <div class="mb-3">
                            <label>Địa chỉ nhận hàng</label>
                            <input type="text" id="cus_address" class="form-control" required placeholder="Số nhà, đường, phường/xã...">
                        </div>
                        <div class="mb-3">
                            <label>Ghi chú (Tùy chọn)</label>
                            <textarea id="cus_note" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">XÁC NHẬN ĐẶT HÀNG</button>
                        <a href="CART.HTML" class="btn btn-outline-secondary w-100 mt-2">Quay lại giỏ hàng</a>
                    </form>
                </div>

                <div class="col-md-5">
                    <div class="bg-light p-3 rounded">
                        <h4>Đơn hàng của bạn</h4>
                        <hr>
                        <div id="order-summary">
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <h5>Tổng cộng:</h5>
                            <h5 class="text-danger" id="order-total">$0.00</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                
                const cart = JSON.parse(localStorage.getItem("cart")) || [];
                const summaryDiv = document.getElementById("order-summary");
                const totalEl = document.getElementById("order-total");
                const GOANDCAMP_DIR = "/GoAndCamp"; 

                if (cart.length === 0) {
                    alert("Giỏ hàng trống! Vui lòng mua hàng trước.");
                    window.location.href = "index.html"; 
                    return;
                }

                let totalAmount = 0;
                let html = "";

                cart.forEach(item => {
                    let itemTotal = item.price * item.quantity;
                    totalAmount += itemTotal;
                    html += `
                        <div class="d-flex justify-content-between mb-2 small">
                            <span>${item.name} (x${item.quantity})</span>
                            <span class="fw-bold">$${itemTotal.toFixed(2)}</span>
                        </div>
                    `;
                });

                summaryDiv.innerHTML = html;
                totalEl.textContent = "$" + totalAmount.toFixed(2);

                document.getElementById("checkout-form").addEventListener("submit", function(e) {
                    e.preventDefault(); 

                    if(!document.getElementById("cus_name").value || !document.getElementById("cus_phone").value || !document.getElementById("cus_address").value){
                        alert("Vui lòng điền đủ Họ tên, Số điện thoại và Địa chỉ.");
                        return;
                    }
                    
                    const orderData = {
                        customer: {
                            name: document.getElementById("cus_name").value,
                            phone: document.getElementById("cus_phone").value,
                            address: document.getElementById("cus_address").value,
                            note: document.getElementById("cus_note").value
                        },
                        cart: cart,
                        total: totalAmount
                    };

                    fetch(`http://localhost/GoAndCamp/api/checkout.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData)
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "success") {
                            alert("🎉 Đặt hàng thành công! Mã đơn: " + data.order_id);
                            localStorage.removeItem("cart"); 
                            window.location.href = "index.html";
                        } else {
                            alert("Lỗi: " + (data.message || "Lỗi không xác định từ Server."));
                        }
                    })
                    .catch(err => {
                        console.error("Lỗi Fetch:", err);
                        alert("Có lỗi xảy ra khi kết nối Server. Vui lòng kiểm tra XAMPP và đường dẫn API.");
                    });
                });
            });
        </script>
    </body>
    </html>
